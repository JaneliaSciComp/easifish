channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  - psutil>=7.1.3
  - pip:
    # bigstream requires SimpleITK==3.0.0b1 which is not on PyPI - pick it up from the GitHub release assets
    - --find-links https://github.com/SimpleITK/SimpleITK/releases/expanded_assets/v3.0.0b1
    - git+https://github.com/JaneliaSciComp/bigstream@36d4d7e
    - git+https://github.com/JaneliaSciComp/cellpose-tools@920a2e1
    - git+https://github.com/JaneliaSciComp/easifish-spots-tools
