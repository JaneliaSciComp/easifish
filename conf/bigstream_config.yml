ransac:
  blob_sizes: [6, 11]
  nspots: 5000
  num_sigma_max: 6
  cc_radius: 12
  match_threshold: 0.6
  max_spot_match_distance:
  point_matches_threshold: 15
  align_threshold: 2.0
  diagonal_constraint: 0.15
  fix_mask_percentile: [10, 90]
  fix_spots_count_threshold: 25
  fix_spot_detection_kwargs:
    blob_method: log
    background_subtract: false
    threshold: 0.0001
    threshold_rel: 0.001
    winsorize_limits: [0.01, 0.10]
  mov_mask_percentile: [1, 95]
  mov_spots_count_threshold: 25
  mov_spot_detection_kwargs:
    blob_method: log
    background_subtract: false
    threshold: 0.000001
    threshold_rel: 0

global_prealign:
  affine:
    alignment_spacing: 4
    shrink_factors: [2]
    smooth_sigmas: [0.5]
    metric: MMI
    optimizer: RSGD
    optimizer_args:
      minStep: 0
      learningRate: 0.4
      numberOfIterations: 400

global_align:
  ransac:
    # overriden parameters
    num_sigma_max: 5
    point_matches_threshold: 15

  affine:
    initial_condition: PHASE_CORRELATION
    alignment_spacing: 1
    shrink_factors: [4, 2, 1]
    smooth_sigmas: [24, 12, 6]
    metric: MMI
    optimizer: RSGD
    optimizer_args:
      learningRate: 8
      minStep: 0.001
      numberOfIterations: 500
      estimateLearningRate: 1

  deform:
    alignment_spacing: 2.0
    control_point_spacing: 40
    control_point_levels: [1]
    shrink_factors: [2]
    smooth_sigmas: [120]
    metric: MMI
    optimizer: RSGD
    optimizer_args:
      learningRate: 1
      minStep: 0.00001
      numberOfIterations: 60

local_align:
  ransac:
    # overriden parameters
    alignment_spacing: 1
    num_sigma_max: 6
    point_matches_threshold: 15
    fix_spots_count_threshold: 20
    mov_spots_count_threshold: 20

  affine:
    alignment_spacing: [0.9,0.8,0.8]
    shrink_factors: [1]
    smooth_sigmas: [1]
    metric: MMI
    optimizer: RSGD
    optimizer_args:
      learningRate: 4
      minStep: 0
      numberOfIterations: 200

  deform:
    alignment_spacing: 0.9
    control_point_spacing: 40
    control_point_levels: [1]
    shrink_factors: [1]
    smooth_sigmas: [1.0]
    metric: MMI
    optimizer: RSGD
    optimizer_args:
      learningRate: 0.7
      minStep: 0.00001
      numberOfIterations: 60
